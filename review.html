<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测评 - 甄别</title>
    <link rel="icon" type="image/png" sizes="32x32" href="https://i.imgs.ovh/2026/06/06/f9023e1e21fe386fe27c023cf310de93.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.imgs.ovh/2026/06/06/280dcab62a105ea80fcf213e897c8dfc.png">
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-red: #E63946;
            --color-black: #0A0A0A;
            --color-dark: #121212;
            --color-gray: #1A1A1A;
            --color-light-gray: #2A2A2A;
            --color-text: #E0E0E0;
            --color-text-muted: #888888;
            --font-display: 'Microsoft YaHei', 'Microsoft YaHei UI', 'Arial Black', 'Impact', sans-serif;
            --font-mono: 'Consolas', 'Courier New', 'Microsoft YaHei', monospace;
            --font-sans: 'Microsoft YaHei', 'Microsoft YaHei UI', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-black);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 顶栏 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(230, 57, 70, 0.1);
            z-index: 1000;
            padding: 15px 30px;
        }

        .header-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .logo-avatar {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: 2px solid var(--color-red);
            overflow: hidden;
        }

        .logo-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-name {
            font-family: var(--font-display);
            font-size: 20px;
            color: var(--color-text);
            letter-spacing: 3px;
        }

        .logo-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--color-red);
            letter-spacing: 2px;
        }

        /* 导航菜单 */
        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--color-text-muted);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            padding-bottom: 5px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--color-red);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--color-red);
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        nav a.active {
            color: var(--color-red);
        }

        /* 巨幅海报 - 倾斜图片墙 */
        .hero-section {
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: var(--color-black);
        }

        /* 游戏封面掉落雨容器 */
        .hero-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            perspective: 800px;
        }

        /* 游戏封面卡片 */
        .game-cover {
            position: absolute;
            /* 2:3比例 */
            width: 100px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            will-change: transform;
            transition: filter 0.3s ease;
        }

        .game-cover:hover {
            filter: brightness(1.1);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
        }

        /* 渐变遮罩层 */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to right, 
                rgba(10, 10, 10, 0.85) 0%, 
                rgba(10, 10, 10, 0.5) 40%, 
                rgba(10, 10, 10, 0.2) 70%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 5;
        }

        .hero-content {
            position: absolute;
            bottom: 150px;
            left: 80px;
            max-width: 400px;
            z-index: 10;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: 48px;
            color: white;
            line-height: 1.2;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(230, 57, 70, 0.3);
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scroll-hint {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: bounce 2s infinite;
            z-index: 10;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-10px); }
            60% { transform: translateX(-50%) translateY(-5px); }
        }

        .scroll-text {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--color-text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .scroll-arrow {
            width: 20px;
            height: 35px;
            border: 2px solid var(--color-red);
            border-radius: 10px;
            position: relative;
        }

        .scroll-arrow::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 10px;
            background: var(--color-red);
            border-radius: 2px;
            animation: scrollDown 1.5s ease-in-out infinite;
        }

        @keyframes scrollDown {
            0% { transform: translateX(-50%) translateY(0); opacity: 1; }
            100% { transform: translateX(-50%) translateY(15px); opacity: 0; }
        }

        /* 主要内容区 */
        .content-section {
            padding: 120px 30px;
            background: var(--color-dark);
            min-height: 60vh;
        }

        .content-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 30px;
        }

        /* 左侧板块 - 精选评测 */
        .left-section {
            flex: 1;
            min-width: 0;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 28px;
            color: var(--color-text);
            margin-bottom: 30px;
            letter-spacing: 2px;
            position: relative;
            padding-left: 20px;
        }

        .section-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 24px;
            background: var(--color-red);
            border-radius: 2px;
        }

        /* 评测卡片网格 */
        .review-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        /* 评测卡片 */
        .review-card {
            background: var(--color-gray);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            aspect-ratio: 3/2;
            width: 100%;
        }

        .review-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.2);
        }

        .review-card-content {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .review-card-image {
            width: 40%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .review-card-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 0;
            justify-content: space-between;
        }

        .review-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .review-card-title {
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text);
            line-height: 1.3;
            flex: 1;
        }

        .review-card-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--color-red);
            background: rgba(230, 57, 70, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .review-card-rating {
            font-size: 12px;
            color: #FFD700;
        }

        .review-card-text {
            font-family: var(--font-sans);
            font-size: 12px;
            color: var(--color-text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 右侧板块 - 资料卡 */
        .right-section {
            width: 300px;
            flex-shrink: 0;
        }

        .profile-card {
            background: var(--color-gray);
            border-radius: 12px;
            padding: 20px;
            position: sticky;
            top: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }

        /* 暗金色流光效果 */
        .profile-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 20%,
                rgba(184, 134, 11, 0.25) 40%,
                rgba(184, 134, 11, 0.4) 50%,
                rgba(184, 134, 11, 0.25) 60%,
                transparent 80%
            );
            animation: shimmerGold 3s ease-in-out infinite;
            pointer-events: none;
            filter: blur(15px);
        }

        /* 暗红色流光效果 */
        .profile-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                -45deg,
                transparent 20%,
                rgba(230, 57, 70, 0.15) 40%,
                rgba(230, 57, 70, 0.25) 50%,
                rgba(230, 57, 70, 0.15) 60%,
                transparent 80%
            );
            animation: shimmerRed 4s ease-in-out infinite;
            pointer-events: none;
            filter: blur(12px);
        }

        @keyframes shimmerGold {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }
            50%, 100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        @keyframes shimmerRed {
            0% {
                transform: translateX(100%) rotate(-45deg);
            }
            50%, 100% {
                transform: translateX(-100%) rotate(-45deg);
            }
        }

        /* 个人信息头部 */
        .profile-header {
            display: flex;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--color-light-gray);
            position: relative;
            z-index: 1;
        }

        .profile-avatar {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            object-fit: cover;
        }

        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }

        .profile-nickname {
            font-family: var(--font-display);
            font-size: 20px;
            color: var(--color-text);
            letter-spacing: 2px;
        }

        .profile-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--color-text-muted);
            letter-spacing: 1px;
        }

        .stat-value {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--color-text);
            font-weight: 600;
        }

        /* ID列表 */
        .profile-ids {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .id-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: var(--color-dark);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .id-item:hover {
            background: rgba(184, 134, 11, 0.1);
        }

        .id-item.copied {
            background: rgba(76, 175, 80, 0.2);
        }

        .id-label {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--color-red);
            letter-spacing: 1px;
        }

        .id-value {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--color-text);
        }

        /* 全成就游戏展柜 */
        .favorite-games {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .games-title {
            font-family: var(--font-sans);
            font-size: 14px;
            color: var(--color-text);
            font-weight: 600;
            margin: 0;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .game-cover-item {
            aspect-ratio: 2/3;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .game-cover-item:hover {
            transform: scale(1.05);
        }

        .game-cover-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 底部邀请 */
        .profile-footer {
            padding: 12px;
            background: rgba(230, 57, 70, 0.1);
            border-radius: 6px;
            text-align: center;
            margin-top: auto;
        }

        .profile-footer span {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--color-red);
            letter-spacing: 1px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .content-container {
                flex-direction: column;
            }

            .review-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .right-section {
                width: 100%;
                order: -1;
            }

            .screenshot-container {
                position: relative;
                top: 0;
            }
        }

        @media (max-width: 480px) {
            .section-title {
                font-size: 22px;
            }

            .review-card-info {
                padding: 10px;
                gap: 6px;
            }

            .review-card-title {
                font-size: 13px;
            }

            .review-card-text {
                font-size: 11px;
                -webkit-line-clamp: 3;
            }
        }

        /* 页脚 */
        footer {
            padding: 60px 30px;
            background: var(--color-black);
            border-top: 1px solid rgba(230, 57, 70, 0.1);
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .footer-links a {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--color-text-muted);
            text-decoration: none;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--color-red);
        }

        .footer-copyright {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--color-text-muted);
            letter-spacing: 1px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            header {
                padding: 12px 15px;
            }

            .header-container {
                flex-direction: column;
                gap: 10px;
            }

            nav {
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav a {
                font-size: 9px;
                letter-spacing: 1px;
                padding: 6px 10px;
            }

            .hero-section {
                min-height: 100vh;
                height: auto;
            }

            .hero-content {
                left: 20px;
                bottom: 100px;
            }

            .hero-title {
                font-size: 32px;
                line-height: 1.3;
            }

            .content-section {
                padding: 60px 15px;
                min-height: 40vh;
            }

            .footer-links {
                gap: 15px;
            }

            footer {
                padding: 25px 15px;
            }

            .footer-copyright {
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 10px 10px;
            }

            .hero-content {
                left: 15px;
                bottom: 80px;
            }

            .hero-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶栏 -->
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <div class="logo-avatar">
                    <img src="https://i.imgs.ovh/2026/06/06/f9023e1e21fe386fe27c023cf310de93.png" alt="Logo">

            // 配置参数
            const COVER_COUNT = 200;  // 大幅增加同时显示的封面数量
            const FALL_DURATION_MIN = 12000;  // 最慢掉落时间（毫秒）
            const FALL_DURATION_MAX = 20000; // 最快掉落时间（毫秒）
            const COVER_WIDTH_MIN = 80;  // 增大尺寸
            const COVER_WIDTH_MAX = 130; // 增大最大宽度

            let covers = [];
            let animationId = null;
            let startTime = null;

            // 创建封面元素
            function createCover() {
                const img = document.createElement('img');
                img.className = 'game-cover';
                img.src = gameCovers[Math.floor(Math.random() * gameCovers.length)];
                img.alt = ' ';
                img.draggable = false;
                return img;
            }

            // 计算起点和终点（统一从正上到正下）
            function calculatePosition(containerWidth, containerHeight, width, height) {
                // 水平位置固定，覆盖整个宽度
                const x = Math.random() * (containerWidth - width);
                // 从顶部开始
                const startY = -height - Math.random() * 400;
                // 到正下结束
                const endY = containerHeight + height + Math.random() * 200;

                return { x, startY, endY };
            }

            // 初始化封面 - 分散在不同的掉落进度上
            function initCovers() {
                const containerWidth = container.offsetWidth;
                const containerHeight = container.offsetHeight;

                for (let i = 0; i < COVER_COUNT; i++) {
                    const cover = createCover();
                    const width = Math.floor(Math.random() * (COVER_WIDTH_MAX - COVER_WIDTH_MIN + 1)) + COVER_WIDTH_MIN;
                    const height = width * 1.5; // 2:3比例

                    const { x, startY, endY } = calculatePosition(containerWidth, containerHeight, width, height);

                    // 随机层级
                    const zIndex = Math.floor(Math.random() * 15) + 1;

                    // 掉落时间随机
                    const duration = Math.random() * (FALL_DURATION_MAX - FALL_DURATION_MIN) + FALL_DURATION_MIN;

                    // 初始延迟：分散在0到duration之间
                    const initialDelay = (i / COVER_COUNT) * duration * 0.8;

                    // 初始进度：让封面分布在不同的掉落阶段
                    const initialProgress = (i / COVER_COUNT);

                    cover.style.width = `${width}px`;
                    cover.style.height = `${height}px`;
                    cover.style.zIndex = zIndex;

                    container.appendChild(cover);

                    covers.push({
                        element: cover,
                        x: x,
                        startY: startY,
                        endY: endY,
                        width: width,
                        height: height,
                        duration: duration,
                        initialDelay: initialDelay,
                        initialProgress: initialProgress,
                        currentY: startY,
                        started: false
                    });
                }
            }

            // 缓动函数
            function easeOutQuad(t) {
                return t * (2 - t);
            }

            // 动画函数
            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                const containerHeight = container.offsetHeight;

                covers.forEach(cover => {
                    // 计算基于初始进度的实际延迟
                    const adjustedElapsed = elapsed + cover.initialDelay;

                    // 检查是否开始
                    if (!cover.started && adjustedElapsed >= 0) {
                        cover.started = true;
                    }

                    if (cover.started) {
                        // 计算进度（考虑初始位置）
                        const totalProgress = cover.initialProgress + (adjustedElapsed / cover.duration);
                        const progress = totalProgress % 1;
                        const easedProgress = easeOutQuad(progress);

                        // 计算当前Y位置（X固定不变，实现正上到正下）
                        cover.currentY = cover.startY + (cover.endY - cover.startY) * easedProgress;

                        cover.element.style.left = `${cover.x}px`;
                        cover.element.style.top = `${cover.currentY}px`;
                    }
                });

                animationId = requestAnimationFrame(animate);
            }

            // 初始化
            initCovers();
            animationId = requestAnimationFrame(animate);

            // 窗口大小变化时重新初始化
            window.addEventListener('resize', () => {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                covers.forEach(cover => cover.element.remove());
                covers = [];
                startTime = null;
                initCovers();
                animationId = requestAnimationFrame(animate);
            });
        })();

        // ========== ID复制功能 ==========
        (function() {
            const idItems = document.querySelectorAll('.id-item');
            
            // 创建复制提示Toast
            function createToast(message) {
                const toast = document.createElement('div');
                toast.className = 'copy-toast';
                toast.textContent = message;
                toast.style.cssText = `
                    position: fixed;
                    top: 100px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: rgba(76, 175, 80, 0.9);
                    color: white;
                    padding: 12px 24px;
                    border-radius: 8px;
                    font-family: var(--font-mono);
                    font-size: 12px;
                    letter-spacing: 1px;
                    z-index: 9999;
                    opacity: 0;
                    transition: opacity 0.3s ease, transform 0.3s ease;
                `;
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.style.opacity = '1';
                    toast.style.transform = 'translateX(-50%) translateY(0)';
                }, 10);
                
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(-50%) translateY(-10px)';
                    setTimeout(() => {
                        toast.remove();
                    }, 300);
                }, 2000);
            }
            
            idItems.forEach(item => {
                item.addEventListener('click', async () => {
                    const idValue = item.querySelector('.id-value').textContent;
                    
                    try {
                        await navigator.clipboard.writeText(idValue);
                        item.classList.add('copied');
                        createToast('✓ 复制成功');
                        
                        setTimeout(() => {
                            item.classList.remove('copied');
                        }, 2000);
                    } catch (err) {
                        console.error('复制失败:', err);
                        createToast('✗ 复制失败');
                    }
                });
            });
        })();
